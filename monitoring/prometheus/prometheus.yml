global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'kafka-connect'
    static_configs:
      - targets: ['kafka-connect:9404']

  - job_name: 'clickhouse'
    scrape_interval: 10s
    static_configs:
      - targets: ['clickhouse:9363']

  - job_name: 'statsd-exporter'
    static_configs:
      - targets: ['statsd-exporter:9102']