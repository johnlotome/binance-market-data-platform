name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest tests/ -v

  integration-test:
    runs-on: ubuntu-latest
    needs: lint-and-unit-test
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          POSTGRES_DB=sourcedb
          POSTGRES_USER=app
          POSTGRES_PASSWORD=app
          POSTGRES_PORT=5432
          CLICKHOUSE_USER=default
          CLICKHOUSE_PASSWORD=pass
          CLICKHOUSE_HOST=clickhouse
          CLICKHOUSE_PORT=8123
          SYMBOLS=BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT,ADAUSDT,DOGEUSDT,TRXUSDT
          EOF

      - name: Build images
        run: docker compose build

      - name: Bring up the full stack
        run: docker compose up -d

      - name: Wait for Postgres, ClickHouse, Kafka Connect to be healthy
        run: |
          timeout 180 bash -c '
            until curl -sf http://localhost:8123/ping \
              && curl -sf http://localhost:8083/connectors \
              && docker compose exec -T postgres pg_isready -U app -d sourcedb; do
              echo "waiting for core services..."; sleep 5
            done'

      - name: Confirm Debezium connector auto-registered
        run: |
          timeout 60 bash -c '
            until curl -s http://localhost:8083/connectors | grep -q "pg-crypto-prices-connector"; do
              echo "waiting for connector registration..."; sleep 3
            done'

      - name: Wait for Airflow to be ready
        run: |
          timeout 180 bash -c '
            until curl -sf http://localhost:8080/api/v2/monitor/health > /dev/null; do
              echo "waiting for airflow..."; sleep 5
            done'

      # - name: Trigger one ingestion cycle
      #   run: docker compose exec -T airflow python /opt/airflow/project/ingestion/ingest_prices.py

      - name: Seed all 8 symbols directly into Postgres (bypasses Binance — geo-blocked from CI runners)
        run: |
          docker compose exec -T postgres psql -U app -d sourcedb -c "
            INSERT INTO crypto_prices (
              symbol, coin_id, name, current_price, price_change_24h,
              price_change_percent_24h, total_volume, quote_volume,
              high_price_24h, low_price_24h, trade_count, last_updated, ingested_at
            ) VALUES
              ('BTCUSDT', 'btc', 'BTC', 79596.0, 824.0, 1.046, 15065.57131, 1187148900.97, 80520.0, 77632.58, 4383542, now(), now()),
              ('ETHUSDT', 'eth', 'ETH', 2504.74, 34.74, 1.406, 321846.862, 802012090.07, 2566.53, 2432.32, 3346775, now(), now()),
              ('BNBUSDT', 'bnb', 'BNB', 706.46, -0.34, -0.048, 142995.848, 100615612.89, 715.79, 692.1, 822502, now(), now()),
              ('SOLUSDT', 'sol', 'SOL', 104.97, 8.58, 8.901, 3699236.998, 369534072.18, 105.06, 94.95, 1658707, now(), now()),
              ('XRPUSDT', 'xrp', 'XRP', 1.4276, 0.058, 4.19, 163101149.9, 233074587.9, 1.4431, 1.3574, 1498122, now(), now()),
              ('ADAUSDT', 'ada', 'ADA', 0.2129, 0.0075, 3.651, 128285684.1, 27245842.9959, 0.2133, 0.2129, 185825, now(), now()),
              ('DOGEUSDT', 'doge', 'DOGE', 0.08924, 0.00315, 3.659, 688361965.0, 66058013.38699, 0.08986, 0.08385, 725048, now(), now()),
              ('TRXUSDT', 'trx', 'TRX', 0.3371, 0.0021, 0.627, 114393371.2, 38480086.17044, 0.3371, 0.3338, 64709, now(), now())
            ON CONFLICT (symbol) DO UPDATE SET
              current_price = EXCLUDED.current_price,
              ingested_at = EXCLUDED.ingested_at;
          "

      - name: Give CDC time to propagate Postgres -> Kafka -> ClickHouse
        run: sleep 30

      - name: Verify rows landed in ClickHouse raw layer
        run: |
          COUNT=$(curl -s "http://localhost:8123/?query=SELECT+count()+FROM+raw.crypto_prices" --user "default:pass")
          echo "Row count: $COUNT"
          [ "$COUNT" -gt 0 ]

      - name: Run dbt build against the live stack
        run: |
          docker compose exec -T airflow bash -c \
            "cd /opt/airflow/project/dbt && /home/airflow/dbt-venv/bin/dbt build --profiles-dir . --target-path /tmp/dbt-target --log-path /tmp/dbt-logs"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v